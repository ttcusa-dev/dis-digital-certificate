<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masked GIF with Tint</title>
  <style>
    /* Full-page black background */
    body {
      margin: 0;
      padding: 0;
      background-color: black;
    }

    /* Container auto-sizes to the GIF */
    .container {
      display: inline-block;
      position: relative;
      /* tint color via `color` */
    }

    /* GIF image drives container size */
    .container img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Overlay SVG covers the same area */
    .container svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    Plug & Play:
    1. Replace src="...gif" with your GIF filename.
    2. Change tint via inline `color`: style="color:#ff0000;" on .container.
    3. Polygon points are in a 0–100 coordinate system (percent-based).
       For four-corner rectangle: "0,0 100,0 100,100 0,100".
       For other shapes, list points in the same scale.
  -->
  <div class="container" style="color: #ff0000; max-width: 400px;">
    <!-- GIF that sizes the container -->
    <img src="Fire Rose.gif" alt="Fire Rose GIF">

    <!-- Overlay SVG masks and tints -->
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="mask">
          <polygon fill="white" points="0,0 100,0 100,100 0,100" />
        </mask>
      </defs>
      <!-- Tint rectangle using the mask -->
      <rect
        x="0" y="0" width="100" height="100"
        fill="currentColor"
        style="mix-blend-mode: color;"
        mask="url(#mask)"
      />
    </svg>
  </div>
</body>
</html>
